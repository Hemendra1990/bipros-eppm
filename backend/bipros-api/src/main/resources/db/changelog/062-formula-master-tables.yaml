                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: formula_code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: project_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: override_expression
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: effective_from
                  type: DATE
              - column:
                  name: effective_to
                  type: DATE
              - column:
                  name: override_reason
                  type: TEXT
              - column:
                  name: override_version
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)
              - column:
                  name: version
                  type: BIGINT

        - createIndex:
            schemaName: udf
            tableName: formula_override
            indexName: idx_fo_formula_project
            unique: true
            columns:
              - column:
                  name: formula_code
              - column:
                  name: project_id

        - createIndex:
            schemaName: udf
            tableName: formula_override
            indexName: idx_fo_project
            columns:
              - column:
                  name: project_id

  - changeSet:
      id: 062-3
      author: opencode
      changes:
        - createTable:
            schemaName: udf
            tableName: formula_version
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: formula_code
