                  constraints:
                    nullable: false
              - column:
                  name: project_id
                  type: UUID
              - column:
                  name: version_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: expression
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: change_reason
                  type: TEXT
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: effective_from
