databaseChangeLog:
  - changeSet:
      id: 140-create-material-shortage-run
      author: claude
      comment: Idempotence log for the weekly material short-supply digest (AI Agent sheet Material row) — one row per (project, ISO week)
      changes:
        - createTable:
            schemaName: ai
            tableName: material_shortage_run
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: project_id, type: UUID, constraints: {nullable: false}}
              - column: {name: week_start, type: DATE, constraints: {nullable: false}}
              - column: {name: shortage_count, type: INT, constraints: {nullable: false}}
              - column: {name: emails_sent, type: INT, constraints: {nullable: false}}
              - column: {name: tracked, type: BOOLEAN, constraints: {nullable: false}}
              - column: {name: generated_at, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_by, type: VARCHAR(255)}
              - column: {name: version, type: BIGINT}
        - addUniqueConstraint:
            schemaName: ai
            tableName: material_shortage_run
            constraintName: uq_material_shortage_run
            columnNames: project_id, week_start
      rollback:
        - dropTable: {schemaName: ai, tableName: material_shortage_run}
