databaseChangeLog:
  - changeSet:
      id: 144-create-material-idle-alert
      author: claude
      comment: Open idle-material alerts per (project, custodian, material, bucket) with reminder count and resolution stamp
      changes:
        - createTable:
            schemaName: ai
            tableName: material_idle_alert
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: project_id, type: UUID, constraints: {nullable: false}}
              - column: {name: custodian_user_id, type: UUID, constraints: {nullable: false}}
              - column: {name: material_key, type: VARCHAR(150), constraints: {nullable: false}}
              - column: {name: bucket_key, type: VARCHAR(40), constraints: {nullable: false}}
              - column: {name: activity_id, type: UUID}
              - column: {name: first_excess, type: "DECIMAL(18,3)"}
              - column: {name: last_excess, type: "DECIMAL(18,3)"}
              - column: {name: reminder_count, type: INT, constraints: {nullable: false}}
              - column: {name: first_sent_at, type: TIMESTAMP}
              - column: {name: last_sent_at, type: TIMESTAMP}
              - column: {name: resolved_at, type: TIMESTAMP}
              - column: {name: created_at, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_by, type: VARCHAR(255)}
              - column: {name: version, type: BIGINT}
        - addUniqueConstraint:
            schemaName: ai
            tableName: material_idle_alert
            constraintName: uq_material_idle_alert
            columnNames: project_id, custodian_user_id, material_key, bucket_key
      rollback:
        - dropTable: {schemaName: ai, tableName: material_idle_alert}
